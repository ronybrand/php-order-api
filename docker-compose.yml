# Local development stack. Every port is bound to 127.0.0.1: nothing here is meant to be reachable from the network.
# The credentials below are throwaway values for this machine only.
services:
  postgres:
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  app: &app
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment: &env
      APP_ENV: local
      APP_KEY: base64:ZGV2ZWxvcG1lbnQta2V5LWRvLW5vdC11c2UtaW4tcHJvZA==
      DB_CONNECTION: pgsql
      DB_URL: postgres://orders:orders@postgres:5432/orders
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_AUDIENCE: order-api
      JWT_ISSUER: https://idp.example
      CACHE_STORE: file
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: orders@example.com
    volumes: ["./keys:/keys:ro"]

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on: [app]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./public:/var/www/public:ro"]
    ports: ["127.0.0.1:8080:8080"]

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  worker:
    <<: *app
    command: ["php", "artisan", "orders:work"]
