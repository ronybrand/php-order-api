server {
    listen 8080;
    server_name _;
    root /var/www/public;

    # The application enforces MAX_BODY_BYTES itself; this is the outer bound.
    client_max_body_size 2m;
    server_tokens off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    location ~ \.php$ {
        return 404;
    }
}
